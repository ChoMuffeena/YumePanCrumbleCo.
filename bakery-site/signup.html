<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — YumePan Crumb Co</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="signup">
  <header class="site-header">
    <a class="logo" href="index.html">YumePan Crumb Co</a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="products.html">Products</a>
      <a href="contact.html">Contact</a>
      <a href="signup.html">Sign Up</a>
    </nav>
    <button class="menu-toggle" aria-expanded="false" aria-label="Toggle navigation">☰</button>
  </header>

  <main class="page-content">
    <section>
      <p class="eyebrow">Sign Up</p>
      <h1>Join the YumePan family</h1>
      <p>Subscribe to our newsletter for soft bread drops, pastry launches, and exclusive tasting events.</p>
    </section>

    <section class="form-card" style="margin-top: 24px; background: var(--white); border: 1px solid var(--border); border-radius: 24px; padding: 32px;">
      <form class="validate-form form-grid" novalidate>
        <div class="field">
          <label for="signup-name">Name</label>
          <input id="signup-name" name="name" type="text" data-required>
          <span class="error-message"></span>
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" data-required>
          <span class="error-message"></span>
        </div>
        <div class="field">
          <label for="signup-birthday">Birthday</label>
          <input id="signup-birthday" name="birthday" type="date" data-required>
          <span class="error-message"></span>
        </div>
        <div class="field">
          <label for="signup-pastry">Preferred pastry</label>
          <select id="signup-pastry" name="preferred-pastry" data-required>
            <option value="">Choose one</option>
            <option value="matcha-bun">Matcha Bun</option>
            <option value="custard-bun">Custard Bun</option>
            <option value="milk-bread">Milk Bread</option>
            <option value="cheesecake">Japanese Cheesecake</option>
          </select>
          <span class="error-message"></span>
        </div>
        <button class="button" type="submit">Subscribe Now</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>YumePan Crumb Co • 88 Sakura Lane • Open Mon–Sat 8AM–6PM</p>
    <p><a href="index.html">Home</a> • <a href="products.html">Products</a> • <a href="contact.html">Contact</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
